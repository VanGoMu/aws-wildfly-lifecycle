# The ALB of the local environment. /wfl/listeners.conf, written by local/run.sh as
# automation/runbook.py shift_traffic modifies the listeners, defines one upstream per target
# group (blue, green), $production_pool (split by weight), $test_pool (one color) and
# $listeners_id (which version of the file this is).
include /wfl/listeners.conf;

map $server_port $listener {
  8081 test;
  default production;
}

map $server_port $pool {
  8081 $test_pool;
  default $production_pool;
}

# One JSON line per request: what CloudWatch counts per target group, read by local/run.sh in the
# CheckCanary step (requests and 5XX of the new color since the weight change).
log_format alb escape=json '{"msec":$msec,"listener":"$listener","pool":"$pool",'
  '"status":$status,"upstream_status":"$upstream_status","request_time":$request_time,'
  '"uri":"$request_uri"}';

server {
  listen 80;
  listen 8081;
  access_log /wfl/access.log alb;
  # Which color answered: curl -i shows it, and k6 counts by it.
  add_header X-Wfl-Color $pool always;

  location / {
    proxy_pass http://$pool;
    # One target per group: a failed request is never retried on the other color.
    proxy_next_upstream off;
    proxy_connect_timeout 2s;
    proxy_set_header Host $host;
  }
}

# A reload is asynchronous: local/run.sh asks here until the workers run the new listeners.conf.
server {
  listen 127.0.0.1:8099;
  access_log off;

  location / {
    return 200 "$listeners_id\n";
  }
}
