# The local environment of aws-wildfly-lifecycle. local/run.sh drives it; docs/local-development.md
# tells what each service stands for and what is simulated.
name: wfl-local

# blue and green: the two EC2 instances. systemd needs a privileged container and the host
# cgroups; the repository is mounted read-only, and build/local/ inside it plays S3.
x-instance: &instance
  build: .
  image: wfl-local-instance
  privileged: true
  cgroup: host
  tmpfs: [/run, /run/lock]
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - ..:/repo:ro

services:
  blue:
    <<: *instance
    hostname: blue

  green:
    <<: *instance
    hostname: green

  # The ALB: the production listener splits requests by weight, the test listener points to one
  # color. local/run.sh writes build/local/alb/listeners.conf and reloads nginx.
  alb:
    image: nginx:1.30.5-alpine
    depends_on: [blue, green]
    ports:
      - "${LOCAL_HTTP_PORT:-8000}:80"
      - "${LOCAL_TEST_PORT:-8081}:8081"
    volumes:
      - ./alb.conf:/etc/nginx/conf.d/default.conf:ro
      - ../build/local/alb:/wfl

  # The traffic: k6 against the production listener. Only with docker compose run (local/run.sh
  # load); the summary goes to build/local/results/.
  load:
    image: grafana/k6:1.8.1
    profiles: [load]
    command: [run, --quiet, /scripts/load.js]
    volumes:
      - ./load.js:/scripts/load.js:ro
      - ../build/local/results:/results
