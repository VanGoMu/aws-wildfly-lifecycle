AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  aws-wildfly-lifecycle instance of one color: its security group and the EC2 instance. No key
  pair and no user data: Systems Manager installs it and CodeDeploy deploys to it.

Parameters:
  Prefix:
    Type: String
    AllowedPattern: '^wfl-[a-z][a-z0-9]{0,9}$'
  Color:
    Type: String
    AllowedValues: [blue, green]
  AmiId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]*\.[a-z0-9]+$'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  AssignPublicIp:
    Type: String
    AllowedValues: ['true', 'false']
  InstanceProfileName:
    Type: String
  AppPort:
    Type: Number
    MinValue: 1024
    MaxValue: 65535
  AllowedCidr:
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
  AlbSecurityGroupId:
    Type: String
    Default: ''
    Description: albSecurityGroupId of …/infra/alb; empty = no ALB, and AllowedCidr reaches the app.
    AllowedPattern: '^(sg-[0-9a-f]{8,17})?$'

Conditions:
  HasAlb: !Not [!Equals [!Ref AlbSecurityGroupId, '']]

Resources:
  # The application port only, and only from the ALB when there is one. Neither 22 (shell access
  # is Session Manager) nor 9990 (management stays on 127.0.0.1).
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${Prefix} ${Color}: application port from the ALB or AllowedCidr'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !If [HasAlb, !Ref AlbSecurityGroupId, !Ref AWS::NoValue]
          CidrIp: !If [HasAlb, !Ref AWS::NoValue, !Ref AllowedCidr]
      Tags:
        - {Key: Name, Value: !Sub '${Prefix}-${Color}'}
        - {Key: Color, Value: !Ref Color}

  # The Color tag is what puts the instance in its CodeDeploy deployment group.
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      NetworkInterfaces:
        - DeviceIndex: '0'
          SubnetId: !Ref SubnetId
          AssociatePublicIpAddress: !Ref AssignPublicIp
          GroupSet: [!Ref InstanceSecurityGroup]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 8
            Encrypted: true
            DeleteOnTermination: true
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - {Key: Name, Value: !Sub '${Prefix}-${Color}'}
        - {Key: Color, Value: !Ref Color}

Outputs:
  InstanceId:
    Value: !Ref Instance
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
  SecurityGroupId:
    Value: !Ref InstanceSecurityGroup
